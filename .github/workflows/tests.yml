name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y -q bubblewrap openssh-client  # sandbox + server tests (skipped when unusable)
      - name: Git identity (the project tests make commits)
        run: |
          git config --global user.email "ci@babd.local"
          git config --global user.name "BABD CI"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example project tests
        working-directory: examples/car-game
        run: python -m unittest test_car_game
      - name: Workspace image still draws
        run: python generate_workspace.py

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check babd/dashboard/static/app.js
