[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babd"
version = "0.5.0"
description = "AI software development team: a human CEO, a Team Lead and four specialist agents, each with its own harness and LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11.0", "openai>=3.0.0"]

[project.scripts]
babd = "babd.__main__:main"

[tool.setuptools]
py-modules = ["generate_workspace"]

[tool.setuptools.packages.find]
include = ["babd*"]

[tool.setuptools.package-data]
"babd.dashboard" = ["static/*"]
